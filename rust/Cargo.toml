[package]
name = "unseeing-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "unseeing_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "=0.5.4", features = ["api-4-7", "experimental-wasm", "lazy-function-tables"] }

[features]
nothreads = ["godot/experimental-wasm-nothreads"]

[profile.release]
lto = true
