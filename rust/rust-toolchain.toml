# Native builds (desktop + tests + clippy) pin to this stable release so every
# machine — laptop, droplet, CI — compiles the identical compiler. The wasm
# build overrides with the pinned nightly via build-wasm.sh (see CLAUDE.md:
# gdext wasm needs -Zbuild-std and -Zemscripten-wasm-eh, nightly-only).
[toolchain]
channel = "1.97.1"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
