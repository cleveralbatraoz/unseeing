# Native builds (desktop + tests + clippy) pin to this stable release so every
# machine — laptop, droplet, CI — compiles the identical compiler. The wasm
# build overrides with the pinned nightly via build-wasm.sh (see AGENTS.md:
# gdext wasm needs -Zbuild-std and -Zemscripten-wasm-eh, nightly-only).
[toolchain]
channel = "1.97.1"
# CI runners install pinned toolchains with the minimal profile — without
# this line they arrive lacking the very tools the pipeline gates on.
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
