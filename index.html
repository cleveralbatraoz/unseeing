<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unseeing</title>
<style>
  :root {
    color-scheme: dark;
    --void: #050608;
    --chrome: #0a0c10;
    --line: #1a1e24;
    --bone: #9a958c;
    --bone-dim: #56534d;
    --cane: #ffb35c;
    --click: #a8ecff;
    --step: #b8b0a4;
    --phantom: #8fd66a;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--bone);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  body { user-select: none; -webkit-user-select: none; }
  .begin {
    position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center;
    color: #6b665e; letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px;
    background: rgba(5, 6, 8, 0.25);
    transition: opacity 0.9s; pointer-events: none;
  }
  .begin.gone { opacity: 0; }
  .begin .b2 { margin-top: 14px; font-size: 9px; letter-spacing: 0.14em; color: #45423d; }
  .reticle {
    position: absolute; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px;
    border-radius: 50%;
    background: rgba(190, 184, 172, 0.35);
    box-shadow: 0 0 6px rgba(190, 184, 172, 0.25);
    pointer-events: none;
  }
  .nogl {
    position: absolute; inset: 0; display: none;
    place-items: center; text-align: center; padding: 24px;
    color: var(--bone); line-height: 2;
  }
</style>

<main>
  <canvas id="cv" aria-label="First-person view of a dark maze revealed only by sound pulses"></canvas>
  <div class="reticle"></div>
  <div class="begin" id="begin">
    <div>
      <div>click the dark to begin</div>
      <div class="b2">W A S D walk · mouse to face · click to tap the cane</div>
    </div>
  </div>
  <div class="nogl" id="nogl"><div>This needs WebGL2.<br>Chrome, Edge, Firefox or Safari 16+ on desktop should work.</div></div>
</main>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const gl = cv.getContext('webgl2', { antialias: true });
  if (!gl) { document.getElementById('nogl').style.display = 'grid'; return; }
  cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); location.reload(); });
  const rmq = matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = rmq.matches;
  if (rmq.addEventListener) rmq.addEventListener('change', (e) => { reduced = e.matches; });

  // ---- the map: wall centerlines in meters, XZ plane, 20 x 20 room ---------
  const H = 3.0, THICK = 0.15;
  const SEGS = [
    [0.6,0.6, 19.4,0.6], [19.4,0.6, 19.4,19.4], [19.4,19.4, 0.6,19.4], [0.6,19.4, 0.6,0.6],
    [6.4,0.6,  6.4,8.0],
    [6.4,12.4, 6.4,19.4],
    [6.4,8.0,  14.0,8.0],
    [14.0,8.0, 14.0,15.6],
    [9.0,15.6, 14.0,15.6],
    [0.6,13.0, 4.0,13.0],
  ];

  // ---- shaders -------------------------------------------------------------
  const VS = `#version 300 es
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aNor;
  uniform mat4 uVP;
  out vec3 vPos;
  out vec3 vNor;
  void main() {
    vPos = aPos;
    vNor = aNor;
    gl_Position = uVP * vec4(aPos, 1.0);
  }`;

  // The pulse-memory model, exactly as the Godot spatial shader will do it:
  // light at a point = sum over pulses of (wavefront band + lingering ghost),
  // both modulated by world-static ink noise. No buffers, no state.
  const MAXP = 64;
  const FS = `#version 300 es
  precision highp float;
  in vec3 vPos;
  in vec3 vNor;
  out vec4 frag;
  uniform float uTime;
  uniform float uFlick;
  uniform vec3  uEye;
  uniform int   uCount;
  uniform float uBase;            // standing reveal (the cane is always faintly known)
  uniform vec3  uPPos[${MAXP}];
  uniform vec4  uPDat[${MAXP}];   // t0, maxR, speed, type*10 + gain*9
  uniform vec4  uPDir[${MAXP}];   // beam direction xyz, cos(half-angle); w = -2 means omni

  void main() {
    // The world is never drawn. This pass only records data per pixel:
    //   R: how recently/strongly a wave swept this point (drives outline reveal)
    //   G,B: world normal xy    A: distance from the eye (occlusion + edges)
    float reveal = 0.0;

    for (int i = 0; i < ${MAXP}; i++) {
      if (i >= uCount) break;
      vec4 d = uPDat[i];
      if (d.x < 0.0) continue;
      float age = uTime - d.x;
      if (age <= 0.0) continue;

      float typ  = floor(d.w / 10.0);
      float gain = mod(d.w, 10.0) / 9.0;
      float peak = typ < 0.5 ? 1.0 : (typ < 1.5 ? 0.9 : 0.35);

      float dist = distance(vPos, uPPos[i]);
      float R = d.z * age;
      if (dist > min(R, d.y)) continue;
      vec3 toS = (uPPos[i] - vPos) / max(dist, 0.001);
      // directed sound: only the cone the voice was aimed into carries information
      vec4 cn = uPDir[i];
      float cone = smoothstep(cn.w - 0.15, cn.w + 0.05, dot(-toS, cn.xyz));
      // only the struck spot lights: ignition falls off fast away from the source
      float atten = 1.0 / (1.0 + dist * dist * 0.06);
      float ga = age - dist / d.z;
      float r2 = 1.3 * exp(-ga / 0.25) + 0.5 * exp(-ga / 3.0);   // flare, then fade
      reveal = max(reveal, min(r2, 1.0) * atten * cone * gain * peak);
    }

    reveal = max(reveal, uBase);
    float vd = distance(vPos, uEye);
    reveal *= (0.9 + 0.1 * uFlick) * exp(-vd * 0.05);
    frag = vec4(clamp(reveal, 0.0, 1.0), vNor.x * 0.5 + 0.5, vNor.y * 0.5 + 0.5, clamp(vd / 40.0, 0.0, 1.0));
  }`;

  // The "hearing" pass: thin white outlines where geometry breaks, visible only
  // where a wave has swept — plus the waves themselves as white rings in the air.
  const POST_VS = `#version 300 es
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const POST_FS = `#version 300 es
  precision highp float;
  out vec4 frag;
  uniform sampler2D uTex;
  uniform vec2  uRes;
  uniform float uBreath;
  uniform float uGrainAmp;
  uniform float uGrainT;
  uniform float uTime;
  uniform float uFlick;
  uniform vec3  uEye;
  uniform vec3  uFwd;
  uniform vec3  uRight;
  uniform vec3  uUp;
  uniform vec2  uProj;
  uniform int   uCount;
  uniform vec3  uPPos[${MAXP}];
  uniform vec4  uPDat[${MAXP}];
  uniform vec4  uPDir[${MAXP}];

  float screenHash(vec2 p) {
    return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
  }
  float n2(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = screenHash(i), b = screenHash(i + vec2(1, 0));
    float c = screenHash(i + vec2(0, 1)), d = screenHash(i + vec2(1, 1));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 px = 1.0 / uRes;
    vec4 C  = texture(uTex, uv);
    vec4 Lx = texture(uTex, uv - vec2(px.x, 0.0));
    vec4 Rx = texture(uTex, uv + vec2(px.x, 0.0));
    vec4 Uy = texture(uTex, uv + vec2(0.0, px.y));
    vec4 Dy = texture(uTex, uv - vec2(0.0, px.y));

    // thin white outlines where geometry breaks — silhouettes (depth Laplacian)
    // and creases (normal difference) — visible only where a wave has swept
    float lap = abs(Lx.a + Rx.a + Uy.a + Dy.a - 4.0 * C.a);
    float nrm = abs(Lx.g - Rx.g) + abs(Uy.g - Dy.g) + abs(Lx.b - Rx.b) + abs(Uy.b - Dy.b);
    float edge = max(smoothstep(0.012, 0.03, lap), smoothstep(0.25, 0.45, nrm));
    float reveal = max(C.r, max(max(Lx.r, Rx.r), max(Uy.r, Dy.r)));
    vec3 col = vec3(edge * reveal);

    // the waves themselves: thin white rings in the air, cut by the world
    vec2 ndc = uv * 2.0 - 1.0;
    vec3 rd = normalize(uFwd + ndc.x * uProj.x * uRight + ndc.y * uProj.y * uUp);
    float sceneD = C.a * 40.0;
    for (int i = 0; i < ${MAXP}; i++) {
      if (i >= uCount) break;
      vec4 d = uPDat[i];
      if (d.x < 0.0) continue;
      float age = uTime - d.x;
      if (age <= 0.0) continue;
      float R = d.z * age;
      float prog = R / d.y;
      if (prog >= 1.0) continue;
      float typ = floor(d.w / 10.0);
      float gain = mod(d.w, 10.0) / 9.0;
      float peak = typ < 0.5 ? 0.5 : (typ < 1.5 ? 0.45 : 0.18);
      vec3 oc = uEye - uPPos[i];
      float b = dot(oc, rd);
      float disc = b * b - (dot(oc, oc) - R * R);
      if (disc <= 0.0) continue;
      float sq = sqrt(disc);
      float env = pow(1.0 - prog, 1.2) * min(age * 10.0, 1.0) * peak * gain * uFlick;
      vec4 cn = uPDir[i];
      for (int s = 0; s < 2; s++) {
        float t = -b + (s == 0 ? -sq : sq);
        if (t <= 0.05 || t >= sceneD) continue;
        vec3 hp = uEye + rd * t;
        vec3 sn = (hp - uPPos[i]) / R;
        float cone = smoothstep(cn.w - 0.15, cn.w + 0.05, dot(sn, cn.xyz));
        if (cone <= 0.0) continue;
        float grz = 1.0 - abs(dot(rd, sn));
        float ink2 = 0.55 + 0.45 * n2(hp.xz * 1.7 + hp.y * 0.9);
        col += vec3(env * cone * (0.05 + 0.95 * pow(max(grz, 0.0), 4.0)) * ink2 * exp(-t * 0.09));
      }
    }

    // the void is not quite empty
    col += vec3(0.006);
    // breathing vignette
    float v = 1.0 - smoothstep(0.38, 0.92, length(uv - 0.5) * 1.35 * uBreath);
    col *= mix(0.45, 1.0, v);
    // grain
    col += (screenHash(gl_FragCoord.xy + uGrainT) - 0.5) * uGrainAmp;
    frag = vec4(max(col, 0.0), 1.0);
  }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function buildProgram(vsSrc, fsSrc, uniforms) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    gl.useProgram(p);
    const u = {};
    for (const n of uniforms) u[n] = gl.getUniformLocation(p, n);
    return { p, u };
  }
  const scene = buildProgram(VS, FS, ['uVP','uTime','uFlick','uEye','uCount','uBase','uPPos','uPDat','uPDir']);
  const post = buildProgram(POST_VS, POST_FS, ['uTex','uRes','uBreath','uGrainAmp','uGrainT',
    'uTime','uFlick','uEye','uFwd','uRight','uUp','uProj','uCount','uPPos','uPDat','uPDir']);
  gl.useProgram(post.p);
  gl.uniform1i(post.u.uTex, 0);


  // ---- geometry: floor, ceiling, wall boxes --------------------------------
  const verts = [];
  function quad(a, b, c, d, n) {
    for (const p of [a, b, c, a, c, d]) verts.push(p[0], p[1], p[2], n[0], n[1], n[2]);
  }
  quad([0,0,20], [20,0,20], [20,0,0], [0,0,0], [0,1,0]);      // floor
  quad([0,H,0], [20,H,0], [20,H,20], [0,H,20], [0,-1,0]);     // ceiling
  for (const [x1, z1, x2, z2] of SEGS) {
    const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz);
    const ux = dx / len, uz = dz / len;            // along the wall
    const px = -uz, pz = ux;                       // across the wall
    const t = THICK;
    const A = [x1 - ux * t, z1 - uz * t], B = [x2 + ux * t, z2 + uz * t];
    const c1 = [A[0] + px * t, A[1] + pz * t], c2 = [B[0] + px * t, B[1] + pz * t];
    const c3 = [B[0] - px * t, B[1] - pz * t], c4 = [A[0] - px * t, A[1] - pz * t];
    const lo = (p) => [p[0], 0, p[1]], hi = (p) => [p[0], H, p[1]];
    quad(lo(c1), lo(c2), hi(c2), hi(c1), [px, 0, pz]);
    quad(lo(c3), lo(c4), hi(c4), hi(c3), [-px, 0, -pz]);
    quad(lo(c2), lo(c3), hi(c3), hi(c2), [ux, 0, uz]);
    quad(lo(c4), lo(c1), hi(c1), hi(c4), [-ux, 0, -uz]);
  }
  const vaoScene = gl.createVertexArray();
  gl.bindVertexArray(vaoScene);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  const vaoPost = gl.createVertexArray();   // no attributes; post pass uses gl_VertexID
  const vaoProp = gl.createVertexArray();
  gl.bindVertexArray(vaoProp);
  const propVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, propVbo);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  gl.bindVertexArray(null);
  const caneArr = [], legsArr = [];   // world-space body geometry, rebuilt every frame
  const vertCount = verts.length / 6;
  gl.disable(gl.CULL_FACE);
  gl.clearColor(0, 0, 0, 1);                // alpha 1 = "far" in the distance channel

  // offscreen target the scene renders into; the hearing pass reads it back
  const fbo = gl.createFramebuffer();
  const sceneTex = gl.createTexture();
  const depthRb = gl.createRenderbuffer();
  function setupTargets() {
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cv.width, cv.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.bindRenderbuffer(gl.RENDERBUFFER, depthRb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, cv.width, cv.height);
    gl.bindRenderbuffer(gl.RENDERBUFFER, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depthRb);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // ---- tiny mat4 -----------------------------------------------------------
  function perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return [f / aspect,0,0,0, 0,f,0,0, 0,0,(far + near) * nf,-1, 0,0,2 * far * near * nf,0];
  }
  function lookAt(eye, dir) {
    const up = [0, 1, 0];
    const zx = -dir[0], zy = -dir[1], zz = -dir[2];
    let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
    const xl = Math.hypot(xx, xy, xz); xx /= xl; xy /= xl; xz /= xl;
    const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
    return [xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
            -(xx*eye[0]+xy*eye[1]+xz*eye[2]),
            -(yx*eye[0]+yy*eye[1]+yz*eye[2]),
            -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1];
  }
  function mul(a, b) {
    const o = new Array(16);
    for (let c = 0; c < 4; c++)
      for (let r = 0; r < 4; r++)
        o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
    return o;
  }

  // ---- pulse slots ---------------------------------------------------------
  const pPos = new Float32Array(MAXP * 3);
  const pDat = new Float32Array(MAXP * 4).fill(-1);
  const pDir = new Float32Array(MAXP * 4);
  const meta = [];  // {t0, type, end} per slot, or null
  for (let i = 0; i < MAXP; i++) meta.push(null);

  function emit(type, x, y, z, maxR, speed, gain, dir, cosHalf, snd) {
    let slot = -1, oldStep = -1, oldest = -1, tOldStep = 1e12, tOld = 1e12;
    for (let i = 0; i < MAXP; i++) {
      const m = meta[i];
      if (!m || now > m.end) { slot = i; break; }
      if (m.type === 2 && m.t0 < tOldStep) { tOldStep = m.t0; oldStep = i; }
      if (m.t0 < tOld) { tOld = m.t0; oldest = i; }
    }
    if (slot < 0) slot = oldStep >= 0 ? oldStep : oldest;
    pPos[slot*3] = x; pPos[slot*3+1] = y; pPos[slot*3+2] = z;
    pDat[slot*4] = now; pDat[slot*4+1] = maxR; pDat[slot*4+2] = speed;
    pDat[slot*4+3] = type * 10 + Math.min(gain, 1) * 9;
    pDir[slot*4]     = dir ? dir[0] : 0;
    pDir[slot*4 + 1] = dir ? dir[1] : 0;
    pDir[slot*4 + 2] = dir ? dir[2] : 0;
    pDir[slot*4 + 3] = dir ? cosHalf : -2;   // -2 = omnidirectional
    meta[slot] = { t0: now, type, end: now + maxR / speed + 6.0 };
    tick(snd === undefined ? type : snd, gain);
  }

  // ---- minimal audio: dry ticks, only to justify the light -----------------
  let AC = null, noiseBuf = null;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.25, AC.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ch.length * 0.12));
    } catch (e) { AC = null; }
  }
  function tick(type, gain) {
    if (!AC || AC.state !== 'running') return;
    const t = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = [1700, 2600, 320, 880][type];
    f.Q.value = type === 3 ? 22 : 9;
    const g = AC.createGain();
    const vol = [0.22, 0.26, 0.15, 0.20][type] * gain;
    g.gain.setValueAtTime(Math.max(vol, 0.001), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + [0.08, 0.05, 0.10, 0.45][type]);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + 0.5);
  }

  // ---- player --------------------------------------------------------------
  const player = { x: 3, z: 4, yaw: 1.9, pitch: 0, r: 0.35 };
  const EYE = 1.6;
  function segDist(px, pz, x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1;
    const t = Math.max(0, Math.min(1, ((px - x1) * dx + (pz - z1) * dz) / (dx * dx + dz * dz)));
    return Math.hypot(px - (x1 + t * dx), pz - (z1 + t * dz));
  }
  const blocked = (x, z) => SEGS.some(([a, b, c, d]) => segDist(x, z, a, b, c, d) < player.r + THICK);

  // XZ raycast against wall centerlines; returns distance or Infinity
  function castRay(ox, oz, dx, dz, maxD) {
    let best = Infinity;
    for (const [x1, z1, x2, z2] of SEGS) {
      const sx = x2 - x1, sz = z2 - z1;
      const den = dx * sz - dz * sx;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((x1 - ox) * sz - (z1 - oz) * sx) / den;
      const u = ((x1 - ox) * dz - (z1 - oz) * dx) / den;
      if (t > 0.05 && t < maxD && u >= 0 && u <= 1 && t < best) best = t;
    }
    return best;
  }

  // --- cartoon body geometry: SMOOTH per-vertex normals, so the edge
  // detector draws only one clean curved silhouette per shape (no facet lines)
  function vpush(arr, p, n) { arr.push(p[0], p[1], p[2], n[0], n[1], n[2]); }
  function pushSphere(arr, c, r) {
    const LA = 6, LO = 12;
    const N = (t, p) => [Math.sin(t) * Math.cos(p), Math.cos(t), Math.sin(t) * Math.sin(p)];
    const P = (n) => [c[0] + n[0] * r, c[1] + n[1] * r, c[2] + n[2] * r];
    for (let i = 0; i < LA; i++) {
      const t0 = (i / LA) * Math.PI, t1 = ((i + 1) / LA) * Math.PI;
      for (let j = 0; j < LO; j++) {
        const p0 = (j / LO) * 2 * Math.PI, p1 = ((j + 1) / LO) * 2 * Math.PI;
        const n00 = N(t0, p0), n01 = N(t0, p1), n10 = N(t1, p0), n11 = N(t1, p1);
        vpush(arr, P(n00), n00); vpush(arr, P(n10), n10); vpush(arr, P(n11), n11);
        vpush(arr, P(n00), n00); vpush(arr, P(n11), n11); vpush(arr, P(n01), n01);
      }
    }
  }
  function pushTube(arr, a, b, r1, r2) {
    let ax = b[0] - a[0], ay = b[1] - a[1], az = b[2] - a[2];
    const al = Math.hypot(ax, ay, az) || 1;
    ax /= al; ay /= al; az /= al;
    const ref = Math.abs(ay) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    let ux = ay * ref[2] - az * ref[1], uy = az * ref[0] - ax * ref[2], uz = ax * ref[1] - ay * ref[0];
    const ul = Math.hypot(ux, uy, uz) || 1;
    ux /= ul; uy /= ul; uz /= ul;
    const vx = ay * uz - az * uy, vy = az * ux - ax * uz, vz = ax * uy - ay * ux;
    const SEG = 10;
    for (let k = 0; k < SEG; k++) {
      const a0 = (k / SEG) * Math.PI * 2, a1 = ((k + 1) / SEG) * Math.PI * 2;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      const d0 = [ux * c0 + vx * s0, uy * c0 + vy * s0, uz * c0 + vz * s0];
      const d1 = [ux * c1 + vx * s1, uy * c1 + vy * s1, uz * c1 + vz * s1];
      const p00 = [a[0] + d0[0] * r1, a[1] + d0[1] * r1, a[2] + d0[2] * r1];
      const p01 = [a[0] + d1[0] * r1, a[1] + d1[1] * r1, a[2] + d1[2] * r1];
      const p10 = [b[0] + d0[0] * r2, b[1] + d0[1] * r2, b[2] + d0[2] * r2];
      const p11 = [b[0] + d1[0] * r2, b[1] + d1[1] * r2, b[2] + d1[2] * r2];
      vpush(arr, p00, d0); vpush(arr, p10, d0); vpush(arr, p11, d1);
      vpush(arr, p00, d0); vpush(arr, p11, d1); vpush(arr, p01, d1);
    }
  }

  // The cane is the ONLY deliberate instrument: nothing taps automatically.
  // Three tap modes, chosen by what the cane can actually reach: wall strike
  // (bright tick, at the aimed height), floor tap (dull thud), air swish
  // (almost nothing answers). The strike point drives the cane animation too.
  let lastTapAt = -10;
  const tapTarget = [0, 0, 0];
  function caneTap() {
    if (now - lastTapAt < 0.15) return;
    lastTapAt = now;
    // a believable white cane: arm + cane reach only ~1.7 m
    const REACH = 1.7;
    const dx = Math.sin(player.yaw), dz = -Math.cos(player.yaw);
    const d = castRay(player.x, player.z, dx, dz, REACH);
    if (d < REACH) {
      const hy = Math.max(0.12, Math.min(1.5, EYE + Math.tan(player.pitch) * d));
      tapTarget[0] = player.x + dx * d; tapTarget[1] = hy; tapTarget[2] = player.z + dz * d;
      emit(0, tapTarget[0], hy, tapTarget[2], 6, 5.5, 1, undefined, undefined, 0);
    } else if (player.pitch <= -0.12) {
      // floor tap only when genuinely aiming down — strike where the gaze lands
      const df = Math.min(1.6, EYE / Math.tan(-player.pitch));
      tapTarget[0] = player.x + dx * df; tapTarget[1] = 0.02; tapTarget[2] = player.z + dz * df;
      emit(0, tapTarget[0], 0.02, tapTarget[2], 5, 5.5, 0.85, undefined, undefined, 2);
    } else {
      // air swish: sound only — air reflects nothing, so nothing appears
      const hy = Math.max(0.3, Math.min(1.7, EYE + Math.tan(player.pitch) * 1.5));
      tapTarget[0] = player.x + dx * 1.5; tapTarget[1] = hy; tapTarget[2] = player.z + dz * 1.5;
      tick(3, 0.5);
    }
  }

  // ---- input ---------------------------------------------------------------
  const keys = new Set();
  // physical key positions, so WASD works on any keyboard layout (ЦФЫВ etc.)
  const physKey = (e) => e.code || (e.key.length === 1 ? 'Key' + e.key.toUpperCase() : e.key);
  addEventListener('keydown', (e) => {
    const k = physKey(e);
    if (['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k)) e.preventDefault();
    if (e.repeat) return;
    ensureAudio();
    keys.add(k);
  });
  addEventListener('keyup', (e) => keys.delete(physKey(e)));
  addEventListener('blur', () => keys.clear());
  document.addEventListener('visibilitychange', () => { if (document.hidden) keys.clear(); });

  // Look: pointer lock when the browser grants it (bare mouse movement turns you);
  // otherwise the cursor's offset from canvas center steers your facing — no dragging.
  let locked = false;
  const steer = { x: 0, y: 0, active: false };
  document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === cv; });
  document.addEventListener('pointerlockerror', () => {});
  cv.addEventListener('pointerdown', (e) => {
    ensureAudio();
    e.preventDefault();
    document.getElementById('begin').classList.add('gone');
    if (!locked && cv.requestPointerLock) {
      try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) {}
    }
    caneTap();
  });
  addEventListener('pointermove', (e) => {
    if (locked) {
      player.yaw += e.movementX * 0.0026;
      player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - e.movementY * 0.0026));
    } else {
      const b = cv.getBoundingClientRect();
      steer.x = ((e.clientX - b.left) / b.width) * 2 - 1;
      steer.y = ((e.clientY - b.top) / b.height) * 2 - 1;
      steer.active = e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom;
    }
  });
  cv.addEventListener('pointerleave', () => { steer.active = false; });

  // ---- resize --------------------------------------------------------------
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.floor(w * dpr) || cv.height !== Math.floor(h * dpr)) {
      cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
      setupTargets();
    }
  }
  addEventListener('resize', resize);

  // ---- loop ----------------------------------------------------------------
  let now = 0, last = 0, stepT = 0, stepSide = 1;
  let phantomAt = 7, flick = 1, dropUntil = -1, nextDrop = 9;
  let caneSwing = 0.15, swingPhase = 0, walkAmp = 0, legPhase = 0;
  let lastYaw = player.yaw, lastPitch = player.pitch, swayX = 0, swayY = 0;
  const shoePos = [[3, 0.07, 4], [3, 0.07, 4]];   // updated by the body build each frame

  function frame(t) {
    now = t / 1000;
    const dt = Math.min(now - last, 0.05); last = now;
    resize();

    // turn with Q/E and arrows
    const turn = ((keys.has('KeyE') || keys.has('ArrowRight')) ? 1 : 0) - ((keys.has('KeyQ') || keys.has('ArrowLeft')) ? 1 : 0);
    player.yaw += turn * 1.9 * dt;

    // free look: cursor offset from center steers facing (quadratic for fine aim)
    if (!locked && steer.active) {
      const dz = 0.12;
      const sx = Math.abs(steer.x) > dz ? (steer.x - Math.sign(steer.x) * dz) / (1 - dz) : 0;
      player.yaw += sx * Math.abs(sx) * 2.6 * dt;
      const targetPitch = -steer.y * 0.9;
      player.pitch += (targetPitch - player.pitch) * Math.min(dt * 6, 1);
    }

    // walk
    const fw = ((keys.has('KeyW') || keys.has('ArrowUp')) ? 1 : 0) - ((keys.has('KeyS') || keys.has('ArrowDown')) ? 1 : 0);
    const st = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
    if (fw || st) {
      const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
      let mx = sy * fw + cy * st, mz = -cy * fw + sy * st;
      const ml = Math.hypot(mx, mz) || 1;
      const sp = 2.1 * dt / ml;
      if (!blocked(player.x + mx * sp, player.z)) player.x += mx * sp;
      if (!blocked(player.x, player.z + mz * sp)) player.z += mz * sp;
      stepT -= dt;
      if (stepT <= 0) {
        // each footfall: a small wave rippling out around that very shoe
        const sp = shoePos[stepSide < 0 ? 0 : 1];
        emit(2, sp[0], 0.04, sp[2], 1.6, 4, 0.8);
        stepSide = -stepSide; stepT = 0.42;
      }
    } else { stepT = 0.1; }

    // a sound you did not make — heard, never seen; it lights nothing
    phantomAt -= dt;
    if (phantomAt <= 0) {
      tick(3, 0.7);
      phantomAt = (reduced ? 20 : 10) + Math.random() * 14;
    }

    // nervous light
    if (!reduced) {
      flick += (1 - flick) * 0.12 + (Math.random() - 0.5) * 0.09;
      flick = Math.max(0.72, Math.min(1.2, flick));
      nextDrop -= dt;
      if (nextDrop <= 0) { dropUntil = now + 0.08 + Math.random() * 0.1; nextDrop = 8 + Math.random() * 10; }
      if (now < dropUntil) flick *= 0.55;
    } else flick = 1;

    // body animation state
    const moving = !!(fw || st);
    walkAmp += ((moving ? 1 : 0) - walkAmp) * Math.min(dt * 6, 1);
    if (moving) { swingPhase += dt * 7.4; legPhase += dt * 7.4; }
    const swingTarget = moving ? 0.26 * Math.sin(swingPhase) : 0.12;
    caneSwing += (swingTarget - caneSwing) * Math.min(dt * 10, 1);
    // strike envelope: quick visible reach-out, then ease back
    const stAge = now - lastTapAt;
    const thrust = stAge < 0.07 ? Math.max(0, stAge / 0.07) : Math.exp(-(stAge - 0.07) / 0.28);
    const fwx = Math.sin(player.yaw), fwz = -Math.cos(player.yaw);
    const rvx = Math.cos(player.yaw), rvz = Math.sin(player.yaw);

    // camera, with the classic subtle head-bob while walking
    const cp = Math.cos(player.pitch);
    const dir = [Math.sin(player.yaw) * cp, Math.sin(player.pitch), -Math.cos(player.yaw) * cp];
    const eye = [player.x, EYE + 0.028 * Math.sin(legPhase * 2) * walkAmp, player.z];
    const vp = mul(perspective(1.15, cv.width / cv.height, 0.05, 60), lookAt(eye, dir));
    const rl = Math.hypot(dir[0], dir[2]) || 1;
    const rightV = [-dir[2] / rl, 0, dir[0] / rl];
    const upV = [rightV[1] * dir[2] - rightV[2] * dir[1],
                 rightV[2] * dir[0] - rightV[0] * dir[2],
                 rightV[0] * dir[1] - rightV[1] * dir[0]];

    // look-sway: the viewmodel lags a touch behind mouse movement
    const invDt = 1 / Math.max(dt, 0.001);
    swayX += (Math.max(-0.07, Math.min(0.07, -(player.yaw - lastYaw) * invDt * 0.02)) - swayX) * Math.min(dt * 9, 1);
    swayY += (Math.max(-0.06, Math.min(0.06, (player.pitch - lastPitch) * invDt * 0.015)) - swayY) * Math.min(dt * 9, 1);
    lastYaw = player.yaw; lastPitch = player.pitch;

    caneArr.length = 0; legsArr.length = 0;
    // classical first-person viewmodel: arm and cane hand live in CAMERA space,
    // with figure-eight walk bob, look-sway lag, and a forward kick on tap
    const V2W = (x, y, z) => [eye[0] + rightV[0] * x + upV[0] * y + dir[0] * z,
                              eye[1] + rightV[1] * x + upV[1] * y + dir[1] * z,
                              eye[2] + rightV[2] * x + upV[2] * y + dir[2] * z];
    const bx = 0.016 * Math.sin(legPhase) * walkAmp + swayX;
    const by = 0.012 * Math.sin(legPhase * 2) * walkAmp + swayY;
    const handW = V2W(0.30 + bx, -0.40 + by - 0.03 * thrust, 0.55 + 0.16 * thrust);
    const elbowW = V2W(0.48 + bx * 0.5, -0.64 + by * 0.5, 0.26);
    pushTube(caneArr, elbowW, handW, 0.055, 0.045);
    pushSphere(caneArr, handW, 0.055);
    // the cane rests toward the ground ahead; during a tap its tip strikes the
    // actual target (wall point, floor point, or empty air) and eases back
    const ca = player.yaw + caneSwing * (1 - thrust);
    const cdx = Math.sin(ca), cdz = -Math.cos(ca);
    const wallD = castRay(player.x, player.z, cdx, cdz, 3.4);
    const reachC = Math.min(1.7, wallD - 0.06);
    const lift = moving ? Math.max(0, 1 - Math.abs(caneSwing) / 0.26) : 0.3;
    const restTip = [player.x + cdx * reachC, 0.03 + 0.14 * lift, player.z + cdz * reachC];
    const tipP = [restTip[0] + (tapTarget[0] - restTip[0]) * thrust,
                  restTip[1] + (tapTarget[1] - restTip[1]) * thrust,
                  restTip[2] + (tapTarget[2] - restTip[2]) * thrust];
    pushTube(caneArr, handW, tipP, 0.013, 0.01);
    pushSphere(caneArr, tipP, 0.04);

    // world-anchored round body: chubby torso capsule + full legs with sphere
    // shoes — revealed ONLY when a sound wave sweeps them
    // small slim torso ending in a pelvis the legs grow out of — one connected body
    const tcx = player.x - fwx * 0.20, tcz = player.z - fwz * 0.20;
    pushTube(legsArr, [tcx, 0.90, tcz], [tcx, 1.28, tcz], 0.11, 0.10);
    pushSphere(legsArr, [tcx, 1.28, tcz], 0.10);
    pushSphere(legsArr, [tcx, 0.90, tcz], 0.13);
    for (let s = -1; s <= 1; s += 2) {
      const ph = legPhase + (s < 0 ? Math.PI : 0);
      const thighA = 0.5 * Math.sin(ph) * walkAmp;
      const kneeA = Math.max(0, 0.95 * Math.sin(ph - 0.9)) * walkAmp;
      const shinA = thighA - kneeA;
      const hip = [player.x + rvx * 0.07 * s - fwx * 0.20, 0.90,
                   player.z + rvz * 0.07 * s - fwz * 0.20];
      const knee = [hip[0] + fwx * Math.sin(thighA) * 0.45, hip[1] - Math.cos(thighA) * 0.45,
                    hip[2] + fwz * Math.sin(thighA) * 0.45];
      const ankle = [knee[0] + fwx * Math.sin(shinA) * 0.45,
                     Math.max(0.07, knee[1] - Math.cos(shinA) * 0.45),
                     knee[2] + fwz * Math.sin(shinA) * 0.45];
      const shoe = [ankle[0] + fwx * 0.08, Math.max(0.065, ankle[1] - 0.02), ankle[2] + fwz * 0.08];
      const si = s < 0 ? 0 : 1;
      shoePos[si][0] = shoe[0]; shoePos[si][1] = shoe[1]; shoePos[si][2] = shoe[2];
      pushTube(legsArr, hip, knee, 0.06, 0.05);
      pushSphere(legsArr, knee, 0.055);
      pushTube(legsArr, knee, ankle, 0.05, 0.04);
      pushSphere(legsArr, shoe, 0.08);
    }

    // highest live slot: lets weak GPUs skip dead loop iterations in both passes
    let activeCount = 0;
    for (let i = 0; i < MAXP; i++) if (meta[i] && now <= meta[i].end) activeCount = i + 1;

    // pass 1: the heard world, into a texture
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.enable(gl.DEPTH_TEST);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(scene.p);
    gl.bindVertexArray(vaoScene);
    gl.uniformMatrix4fv(scene.u.uVP, false, vp);
    gl.uniform1f(scene.u.uTime, now);
    gl.uniform1f(scene.u.uFlick, flick);
    gl.uniform3fv(scene.u.uEye, eye);
    gl.uniform1i(scene.u.uCount, activeCount);
    gl.uniform1f(scene.u.uBase, 0.0);
    gl.uniform3fv(scene.u.uPPos, pPos);
    gl.uniform4fv(scene.u.uPDat, pDat);
    gl.uniform4fv(scene.u.uPDir, pDir);
    gl.drawArrays(gl.TRIANGLES, 0, vertCount);
    // legs join the world's rules: outlined only where waves touch them
    gl.bindVertexArray(vaoProp);
    gl.bindBuffer(gl.ARRAY_BUFFER, propVbo);
    const legsData = new Float32Array(legsArr);
    gl.bufferData(gl.ARRAY_BUFFER, legsData, gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, legsData.length / 6);
    // the cane is always faintly known — the hero's one constant
    gl.uniform1f(scene.u.uBase, 0.85);
    const caneData = new Float32Array(caneArr);
    gl.bufferData(gl.ARRAY_BUFFER, caneData, gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, caneData.length / 6);

    // pass 2: smear it into hearing
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(post.p);
    gl.bindVertexArray(vaoPost);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform2f(post.u.uRes, cv.width, cv.height);
    gl.uniform1f(post.u.uBreath, reduced ? 1 : 1 + Math.sin(now * 0.5) * 0.045);
    gl.uniform1f(post.u.uGrainAmp, reduced ? 0.015 : 0.034);
    gl.uniform1f(post.u.uGrainT, reduced ? 0.0 : (now % 1) * 61.7);
    gl.uniform1f(post.u.uTime, now);
    gl.uniform1f(post.u.uFlick, flick);
    gl.uniform3fv(post.u.uEye, eye);
    gl.uniform3fv(post.u.uFwd, dir);
    gl.uniform3fv(post.u.uRight, rightV);
    gl.uniform3fv(post.u.uUp, upV);
    gl.uniform2f(post.u.uProj, Math.tan(1.15 / 2) * (cv.width / cv.height), Math.tan(1.15 / 2));
    gl.uniform1i(post.u.uCount, activeCount);
    gl.uniform3fv(post.u.uPPos, pPos);
    gl.uniform4fv(post.u.uPDat, pDat);
    gl.uniform4fv(post.u.uPDir, pDir);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, null);


    requestAnimationFrame(frame);
  }

  resize();
  // no wake-up pulse: the world stays void until the player makes a sound
  requestAnimationFrame((t) => { last = t / 1000; now = last; requestAnimationFrame(frame); });

  // test hook: exposed only when explicitly flagged; inert in production
  if (window.__UNSEEING_TEST__ || location.search.indexOf('test') !== -1) {
    window.__unseeingTest = {
      player, keys, meta, pDat, pPos, pDir, shoePos,
      castRay, segDist, blocked, emit, caneTap,
      perspective, lookAt, mul,
      MAXP, SEGS,
      nowSec: () => now,
    };
  }
})();
</script>
