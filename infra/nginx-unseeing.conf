# Unseeing site config — the versioned copy of /etc/nginx/sites-available/unseeing
# Apply on the droplet:
#   sudo cp ~/ci/work/infra/nginx-unseeing.conf /etc/nginx/sites-available/unseeing
#   sudo nginx -t && sudo systemctl reload nginx
server {
    server_name dggrus.hlab.kz _;
    root /var/www/unseeing;
    index index.html;
    charset utf-8;

    # Godot threaded web exports need cross-origin isolation; harmless for
    # the current single-threaded build, required if threads ever return
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # fixed filenames: cache but revalidate, so redeploys reach players
    # immediately while an unchanged 37 MB wasm costs one 304
    add_header Cache-Control "no-cache" always;

    # serve the .gz artifacts the pipeline precompresses (wasm ~4x smaller)
    gzip_static on;

    # crash beacon from the web shell: the message rides the query string and
    # nginx's own access log records it — no backend process
    location = /err {
        access_log /var/log/nginx/unseeing-err.log;
        return 204;
    }

    location / { try_files $uri $uri/ =404; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dggrus.hlab.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dggrus.hlab.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = dggrus.hlab.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dggrus.hlab.kz _;
    return 404; # managed by Certbot
}
