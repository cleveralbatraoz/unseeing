name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run CI pipeline (test-only outside the droplet)
        run: |
          chmod +x ci/pipeline.sh web-reference/test/run.sh
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" ci/pipeline.sh
