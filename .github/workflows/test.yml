name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Validate pinned Superpowers metadata
        run: ci/verify-superpowers.sh metadata
      - name: Fetch the exact Superpowers gitlink
        run: |
          git submodule sync -- tools/superpowers
          git -c protocol.version=2 submodule update --init --depth 1 -- tools/superpowers
          ci/verify-superpowers.sh full
      - name: Install gdtoolkit (gdformat + gdlint)
        run: pipx install "gdtoolkit==4.*"
      - name: Cache cargo + rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: Read pinned Godot version
        id: godot
        run: echo "version=$(cut -d. -f1-3 .godot-version)" >> "$GITHUB_OUTPUT"
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ steps.godot.outputs.version }}-linux-x86_64
      - name: Fetch Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${{ steps.godot.outputs.version }}"
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          python3 -m zipfile -e godot.zip .
          mkdir -p godot-bin
          mv "Godot_v${V}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot
      - name: Run CI pipeline (checks only)
        run: |
          chmod +x ci/pipeline.sh
          GODOT="$PWD/godot-bin/godot" SKIP_EXPORT=1 ci/pipeline.sh
      # The constitution demands the wasm core verified on every change:
      # pinned nightly + emsdk 4.0.20 (matching Godot 4.7's web templates).
      - name: Install wasm toolchain
        run: |
          rustup toolchain install nightly-2026-05-25 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-05-25
          rustup target add wasm32-unknown-emscripten --toolchain nightly-2026-05-25
      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-4.0.20
      - name: Install emsdk 4.0.20
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk && ./emsdk install 4.0.20
      - name: Build wasm core
        run: |
          (cd ~/emsdk && ./emsdk activate 4.0.20)
          ./rust/build-wasm.sh
