name: tests
on:
  push:
    # TEMPORARY: designer-engine-bundle added only so this push can trigger
    # a real verification run of the GitHub Pages deploy job before it
    # merges to main. Reverted to [main] before this branch is done.
    branches: [main, designer-engine-bundle]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    # Was 10 for a checks-only run; the Web export + browser smoke test now
    # in this job's pipeline call take real additional time.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Validate pinned Superpowers metadata
        run: ci/verify-superpowers.sh metadata
      - name: Fetch the exact Superpowers gitlink
        run: |
          git submodule sync -- tools/superpowers
          git -c protocol.version=2 submodule update --init --depth 1 -- tools/superpowers
          ci/verify-superpowers.sh full
      - name: Install gdtoolkit (gdformat + gdlint)
        run: pipx install "gdtoolkit==4.*"
      - name: Cache cargo + rust target
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: Read pinned Godot version
        id: godot
        run: echo "version=$(cut -d. -f1-3 .godot-version)" >> "$GITHUB_OUTPUT"
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6.1.0
        with:
          path: godot-bin
          key: godot-${{ steps.godot.outputs.version }}-linux-x86_64
      - name: Fetch Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${{ steps.godot.outputs.version }}"
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          python3 -m zipfile -e godot.zip .
          mkdir -p godot-bin
          mv "Godot_v${V}-stable_linux.x86_64" godot-bin/godot
          chmod +x godot-bin/godot
      # The editor and the export templates are separate downloads. This job
      # never needed them before -- SKIP_EXPORT=1 skipped the export
      # entirely -- so this step never existed until the pipeline below
      # started doing a real Web export.
      - name: Cache Godot export templates
        id: cache-templates
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ steps.godot.outputs.version }}
      - name: Fetch Godot export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          V="${{ steps.godot.outputs.version }}"
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"
          python3 -m zipfile -e templates.tpz /tmp/godot-templates-extract
          mv /tmp/godot-templates-extract/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          rm -rf /tmp/godot-templates-extract templates.tpz
      # The constitution demands the wasm core verified on every change:
      # pinned nightly + emsdk 4.0.20 (matching Godot 4.7's web templates).
      # This has to run BEFORE the pipeline below now that the pipeline
      # does the real Web export + browser smoke test (dropped
      # SKIP_EXPORT=1): the export needs this exact toolchain already
      # activated, not installed after the fact.
      - name: Install wasm toolchain
        run: |
          rustup toolchain install nightly-2026-05-25 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-05-25
          rustup target add wasm32-unknown-emscripten --toolchain nightly-2026-05-25
      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-4.0.20
      - name: Install emsdk 4.0.20
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk && ./emsdk install 4.0.20
      - name: Build wasm core
        run: |
          (cd ~/emsdk && ./emsdk activate 4.0.20)
          ./rust/build-wasm.sh
      - name: Run CI pipeline (full, including Web export + browser smoke test)
        run: |
          chmod +x ci/pipeline.sh
          GODOT="$PWD/godot-bin/godot" ci/pipeline.sh
      - name: Upload the verified web build as a Pages artifact
        # TEMPORARY: also allow designer-engine-bundle so the deploy job
        # itself (not just the workflow trigger) can be verified for real
        # before merging. Reverted to main-only before this branch is done.
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/designer-engine-bundle') && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: game/build/web

  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Read pinned Godot version
        id: godot
        shell: powershell
        run: |
          $pin = (Get-Content .godot-version -Raw).Trim()
          $version = (($pin -split '\.')[0..2] -join '.')
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n", $utf8)
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6.1.0
        with:
          path: godot-bin
          key: godot-${{ steps.godot.outputs.version }}-windows-x86_64
      - name: Cache Cargo registry and bootstrap targets
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-windows-bootstrap-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: Fetch pinned Godot editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $version = "${{ steps.godot.outputs.version }}"
          $url = "https://github.com/godotengine/godot-builds/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive -LiteralPath godot.zip -DestinationPath godot-bin
      - name: Run Windows bootstrap boundary tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/bootstrap_windows_test.ps1
      - name: Build, import, and census through the real Windows bootstrap
        shell: powershell
        run: |
          $godot = (Get-ChildItem godot-bin -Filter '*_console.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw 'Pinned Godot console executable was not found' }
          & .\tools\bootstrap.cmd -Godot $godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cross-check the Windows ARM64 engine
        shell: powershell
        run: |
          $pin = Select-String -Path rust/rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $pin) { throw 'rust/rust-toolchain.toml carries no channel pin' }
          $toolchain = $pin.Matches[0].Groups[1].Value
          rustup target add aarch64-pc-windows-msvc --toolchain $toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location rust
          rustup run $toolchain cargo check --features editor-docs --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy:
    needs: checks
    # TEMPORARY: see the matching note on the artifact-upload step above.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/designer-engine-bundle') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
      - name: Verify the live page serves this commit
        run: |
          set -eu
          SHORT="$(printf %.9s "${{ github.sha }}")"
          LIVE="$(curl -skL --max-time 30 "${{ steps.deployment.outputs.page_url }}" \
            | grep -o "UNSEEING_BUILD='[^']*'" | head -1 | sed "s/.*='//;s/'//")"
          if [ "$LIVE" != "$SHORT" ]; then
            echo "deploy: FAILED the live page serves build '${LIVE:-none}', not '$SHORT'"
            exit 1
          fi
          echo "deploy: OK — https://cleveralbatraoz.github.io/unseeing/ serves $LIVE"
